[project]
name = "dijkstra-visualizer"
version = "0.1.0"
description = "An interactive, step-by-step Dijkstra visualizer for Fundamentals of AI"
readme = "README.md"
authors = [
    { name = "César Euresti", email = "euresti.mgmt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.7",
    "pyside6>=6.11.2",
]

[project.scripts]
dijkstra-visualizer = "dijkstra_visualizer:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
